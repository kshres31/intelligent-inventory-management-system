services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory_app
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-local_inventory_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_app -d inventory"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro

volumes:
  inventory_postgres_data:
